# Tiny Tapeout project information
project:
  title:        "ARES-RX Sentinel: Hardware Receiver Security Guard"
  author:       "ARES Semiconductor Technology"
  discord:      ""
  description:  "Temporal & syntactic integrity verification with fail-closed hardware isolation for 433MHz receivers"
  language:     "Verilog"
  clock_hz:     20000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ares_sentinel_project"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "tt_um_ares_sentinel_project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "rx_in"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: "address[0]"
  ui[5]: "address[1]"
  ui[6]: "address[2]"
  ui[7]: "address[3]"

  # Outputs
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins
  uio[0]: "tamper_alert"
  uio[1]: "reception_active"
  uio[2]: "l1_timing_violation"
  uio[3]: "l2_syntax_violation"
  uio[4]: "l3_isolated"
  uio[5]: "baseline_full"
  uio[6]: "baseline_clock"
  uio[7]: "baseline_data"

# Do not change!
yaml_version: 6
